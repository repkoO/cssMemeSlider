<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>cssMemeSlider</h1>
  <div class="slider__container">
    <div class="slider__line">
      <div class="slider__items">
        <input type="radio" name="x" id="slide1" checked>
        <input type="radio" name="x" id="slide2">
        <input type="radio" name="x" id="slide3">
        <input type="radio" name="x" id="slide4">
        <div class="slide active">
          <img src="./assets/img/mem_1.png" alt="Slide 1">
          <p>New task</p>
        </div>
        <div class="slide">
          <img src="./assets/img/mem_2.png" alt="Slide 2">
          <p>New problems</p>
        </div>
        <div class="slide">
          <img src="./assets/img/mem_3.png" alt="Slide 3">
          <p>New deadline</p>
        </div>
        <div class="slide">
          <img src="./assets/img/mem_4.png" alt="Slide 4">
          <p>New expirience</p>
        </div>
      </div>
    </div>
    <div class="slider__controls">
      <label for="slide1" class="control"></label>
      <label for="slide2" class="control"></label>
      <label for="slide3" class="control"></label>
      <label for="slide4" class="control"></label>
   </div>
  </div>
</body>
</html>
